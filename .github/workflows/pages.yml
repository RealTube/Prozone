# Publishes a demo copy of the site to GitHub Pages on every push to main.
# The demo copy is marked noindex so it never competes with www.prozone.am in search.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (pages and assets only)
        run: |
          mkdir _site
          cp -r *.html assets _site/
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow">|' _site/*.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
